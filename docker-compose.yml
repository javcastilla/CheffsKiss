name: chef-kiss-infrastructure

services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: chef-kiss-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - .docker/grafana/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"

  loki:
    image: grafana/loki:3.3.0
    container_name: chef-kiss-loki
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    volumes:
      - .docker/grafana/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: chef-kiss-grafana
    volumes:
      - .docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app
    depends_on:
      - tempo
      - loki